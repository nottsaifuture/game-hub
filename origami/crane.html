const intE = []; for (let e = 0; e < nE; e++) if (M.edges[4 * e + 3] >= 0) intE.push(e);

const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(pos, 3)); geo.attributes.position.setUsage(THREE.DynamicDrawUsage);

const P = new Float32Array(nV * 3), Nf = new Float32Array(nF * 3), Of = new Float32Array(nF), box = { c: new THREE.Vector3(), lo: [0, 0, 0], hi: [0, 0, 0] };

  }

}

// ---------- camera ----------
const ctl = new OrbitControls(cam, canvas); ctl.enableDamping = true; ctl.dampingFactor = 0.08; ctl.minDistance = 1.5; ctl.maxDistance = 20; ctl.maxPolarAngle = Math.PI * 0.53;
let autoCam = true, spin = 0; ctl.addEventListener('start', () => { autoCam = false; });
const defCam = { az: 0, el: 58, dist: 6.4 }, fixCam = Q.has('cam') ? (c => ({ az: +c[0], el: +c[1], dist: +c[2] }))(Q.get('cam').split(',')) : null;
const camOf = k => fixCam || S[k].cam || defCam, tgt = new THREE.Vector3();
function aim(k, u, snap) {

// ---------- crease-pattern inset ----------
const cpEl = $('cp'), cpc = cpEl.querySelector('canvas').getContext('2d');
let cpK = -1; function drawCP(k) {
  if (k === cpK) return; cpK = k; const V = M.cp.V, E = M.cp.E, s = S[k]; let lo = 1e9, hi = -1e9; for (const v of V) { lo = Math.min(lo, v); hi = Math.max(hi, v); }
  const sc = 228 / (hi - lo), X = v => 10 + (V[2 * v] - lo) * sc, Y = v => 238 - (V[2 * v + 1] - lo) * sc; cpc.clearRect(0, 0, 248, 248); cpc.lineCap = 'round';
  for (let pass = 0; pass < 2; pass++) for (let e = 0; e < nE; e++) {
    const a = s.ang[e], bd = M.edges[4 * e + 3] < 0, live = bd || Math.abs(a) > 0.06; if (live !== (pass === 1)) continue; if (!live && s.lw[e] === 0) continue;
    cpc.strokeStyle = bd ? getComputedStyle(document.body).color : a === 9 ? '#9a8f84' : !live ? 'rgba(140,125,110,.35)' : a > 0 ? '#2f6fd8' : '#d8452f';
    cpc.lineWidth = bd ? 2.4 : live ? 2 : 1; cpc.beginPath(); cpc.moveTo(X(E[2 * e]), Y(E[2 * e])); cpc.lineTo(X(E[2 * e + 1]), Y(E[2 * e + 1])); cpc.stroke();
  }
}
const toggleCP = () => cpEl.classList.toggle('off'); cpEl.onclick = toggleCP; cpEl.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); toggleCP(); } };

// ---------- playback ----------
let t = 0, playing = !Q.has('paused'), stopAt = null, speed = 1, last = performance.now(), shownK = -1;
$('ttl').innerHTML = `${M.meta.zh}<small>${M.meta.en}</small>`;
const ticks = $('ticks'); for (let k = 1; k < nS; k++) { const i = document.createElement('i'); i.style.left = (seg[k].t0 / total * 100) + '%'; ticks.appendChild(i); }
function caption(k, u) { const shown = u >= 0 ? k : k - 1; if (shown === shownK) return; shownK = shown; const st = S[shown]; $('num').innerHTML = `<div style="display:grid;place-items:center">${shown}<small>/ ${nS - 1}</small></div>`; $('zh').textContent = st.zh; $('en').textContent = st.en; drawCP(shown); }
function render(snap) {
  const { k, u } = locate(t); pose(k, u); aim(k, u, snap); caption(k, t <= seg[1].t0 ? -1 : u);
  ctl.update(); renderer.render(scene, cam);
}
function setPlay(p) { playing = p; $('play').textContent = p ? '⏸' : '▶'; if (p && t >= total - 1e-3) { t = 0; spin = 0; } }
function step(dir) {
  const { k, u } = locate(t); stopAt = null;
  if (dir > 0) { const n = t <= seg[1].t0 ? 1 : (u >= 1 ? Math.min(nS - 1, k + 1) : k); if (u >= 1 || t <= seg[1].t0) t = seg[n].t0; stopAt = seg[n].t0 + seg[n].dur + 0.01; setPlay(true); }
  else { const n = u > 0.15 || k === 1 ? k : k - 1; t = n <= 1 && u <= 0.15 ? 0 : seg[n].t0 - 0.001; setPlay(false); }
}
$('play').onclick = () => { stopAt = null; setPlay(!playing); }; $('next').onclick = () => step(1); $('prev').onclick = () => step(-1);
$('seek').oninput = e => { t = e.target.value / 1000 * total; stopAt = null; setPlay(false); };
$('speed').onclick = () => { speed = speed === 1 ? 2 : speed === 2 ? 0.5 : 1; $('speed').textContent = speed + '×'; };
$('view').onclick = () => { autoCam = true; spin = 0; };
addEventListener('keydown', e => { if (e.target.tagName === 'INPUT') return; if (e.key === ' ') { e.preventDefault(); $('play').click(); } else if (e.key === 'ArrowRight') step(1); else if (e.key === 'ArrowLeft') step(-1); });
const cols = [M.meta.color, '#2f7fc1', '#3f9b6b', '#e2a72e', '#8a5bc7', '#e56b9a'].filter((c, i, a) => a.indexOf(c) === i);
cols.forEach((c, i) => { const b = document.createElement('button'); b.style.background = c; b.setAttribute('aria-label', '紙的顏色 ' + c); b.setAttribute('aria-pressed', i === 0); b.onclick = () => { matOut.color.set(c); document.documentElement.style.setProperty('--accent', c); [...$('sw').children].forEach(x => x.setAttribute('aria-pressed', x === b)); }; $('sw').appendChild(b); });
document.documentElement.style.setProperty('--accent', M.meta.color);
function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
if (Q.has('t')) { t = Math.min(total, +Q.get('t') * total); playing = false; } if (Q.has('step')) { const k = Math.max(1, Math.min(nS - 1, +Q.get('step'))); t = seg[k].t0 + seg[k].dur * (Q.has('u') ? +Q.get('u') : 1); playing = false; }
setPlay(playing); render(true); render(true);
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (playing) { t += dt * speed; if (stopAt !== null && t >= stopAt) { t = stopAt; stopAt = null; setPlay(false); } if (t >= total) { t = total; setPlay(false); } }
  if (t >= total - S[nS - 1].hold && autoCam) spin += dt * 14;
  $('seek').value = Math.round(t / total * 1000);
  render(false); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
window.__origami = { M, seek: (k, u = 1) => { t = seg[k].t0 + seg[k].dur * u; setPlay(false); render(true); render(true); }, cam, ctl, setAuto: v => autoCam = v };
