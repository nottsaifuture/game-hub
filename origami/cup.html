<style>

  * { box-sizing:border-box; }

  #cp { pointer-events:auto; width:124px; height:124px; border-radius:12px; background:var(--card); border:1px solid var(--line); backdrop-filter:blur(8px); padding:8px; cursor:pointer; }

  #dock { position:fixed; left:50%; bottom:max(14px, env(safe-area-inset-bottom)); transform:translateX(-50%); width:min(720px, calc(100vw - 24px)); display:flex; flex-direction:column; gap:8px; }
  #cap { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px 16px 12px; backdrop-filter:blur(10px); box-shadow:0 8px 30px rgba(40,25,10,.12); display:flex; gap:14px; align-items:center; min-height:72px; }
  #num { flex:none; width:46px; height:46px; border-radius:50%; background:var(--accent); color:#fff; display:grid; place-items:center; font-weight:700; font-size:17px; font-variant-numeric:tabular-nums; }
  #num small { font-size:10px; font-weight:500; opacity:.8; margin-top:-4px; }
  #zh { font-size:17px; font-weight:600; line-height:1.35; } #en { font-size:13px; color:var(--mute); margin-top:2px; line-height:1.35; }
  #ctl { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:8px 12px; backdrop-filter:blur(10px); display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  button { font:inherit; color:inherit; background:transparent; border:1px solid var(--line); border-radius:10px; height:36px; min-width:36px; padding:0 9px; cursor:pointer; display:grid; place-items:center; }
  button:hover { background:rgba(128,110,90,.14); } button#play { background:var(--accent); color:#fff; border-color:transparent; min-width:44px; }
  button:focus-visible, #cp:focus-visible, input:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  #track { flex:1 1 180px; position:relative; height:36px; display:flex; align-items:center; min-width:140px; }
  #track input { width:100%; margin:0; accent-color:var(--accent); position:relative; z-index:1; }
  #ticks { position:absolute; left:8px; right:8px; top:50%; height:0; pointer-events:none; }
  #ticks i { position:absolute; top:7px; width:1px; height:5px; background:var(--mute); opacity:.55; }
  .sw { display:flex; gap:5px; } .sw button { width:22px; min-width:22px; height:22px; border-radius:50%; padding:0; border:2px solid var(--card); box-shadow:0 0 0 1px var(--line); }

  @media (max-width:560px) { h1 { font-size:17px; } #zh { font-size:15px; } #en { font-size:12px; } #cp { width:92px; height:92px; } .sw { display:none; } }
